# Development-only config overrides
# Requires a lord-stanley checkout next to this repo.
# Usage:
#   export BUNDLE_GEMFILE=gemfiles/dev.gemfile
#   bundle install
#   bundle exec jekyll serve --config _config.yml,_config_dev.yml

# Use local lord-stanley theme instead of remote
remote_theme: null
theme: lord-stanley
plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
